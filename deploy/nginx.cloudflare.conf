pid /tmp/autocuidado-nginx.pid;
error_log /dev/null;
events {}
http {
    map_hash_bucket_size 128;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/autocuidado-body;
    proxy_temp_path /tmp/autocuidado-proxy;
    fastcgi_temp_path /tmp/autocuidado-fastcgi;
    uwsgi_temp_path /tmp/autocuidado-uwsgi;
    scgi_temp_path /tmp/autocuidado-scgi;
    map $http_x_autocuidado_origin $autocuidado_origin_ok {
        default 0;
        "__AUTOCUIDADO_EDGE_TOKEN__" 1;
    }
    include /etc/nginx/conf.d/00-routes.conf;
    include /app/frontend-nginx.conf;
}
