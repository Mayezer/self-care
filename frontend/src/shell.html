<a class="skip-link" href="#conteudo" (click)="$event.preventDefault(); content.focus()">Ir para o conteúdo</a>
<header class="site-header">
  <div class="page-width header-content">
    <a class="brand" routerLink="/">
      <span class="brand-mark"><img src="/design/themes/ramo.svg" alt="" width="40" height="40"></span>
      <span class="brand-label"><strong>Autocuidado</strong><span>Agenda de cuidados</span></span>
    </a>
    <nav class="main-nav" aria-label="Navegação principal">
      @for (tab of tabs; track tab.path) {
        <a [routerLink]="tab.path" [class.current-link]="activeTab(tab.path)"
           [attr.aria-current]="activeTab(tab.path) ? (page() === 'cronogramas' ? 'location' : 'page') : null">
          <span class="material-symbol" aria-hidden="true">{{ tab.icon }}</span>{{ tab.text }}
        </a>
      }
    </nav>
    <div class="header-actions">
      <details #themeMenu class="theme-control" (keydown.escape)="closeThemeMenu(themeMenu, themeSummary)"
               (focusout)="leaveThemeMenu($event, themeMenu)" (document:pointerdown)="outsideThemeMenu($event, themeMenu)">
        <summary #themeSummary class="theme-trigger">
          <span class="visually-hidden">Tema: </span>
          <span class="theme-label">{{ theme().label }}</span>
          <img [src]="theme().image" width="24" height="24" alt="">
          <span class="theme-chevron" aria-hidden="true"></span>
        </summary>
        <div class="theme-options">
          <fieldset>
            <legend>Tema da interface</legend>
            @for (option of themes; track option.value) {
              <label class="theme-option">
                <input type="radio" name="site-theme" [checked]="theme().value === option.value"
                       (change)="changeTheme(option.value)">
                <span>{{ option.label }}</span>
                <img [src]="option.image" width="24" height="24" alt="">
              </label>
            }
          </fieldset>
        </div>
      </details>
      <a class="icon-button profile-button" routerLink="/perfil" aria-label="Perfil"
         [attr.aria-current]="page() === 'perfil' ? 'page' : null">
        <span class="material-symbol" aria-hidden="true">person</span>
      </a>
    </div>
  </div>
</header>

<canvas [appFallingDecor]="theme().value" class="falling-decor" aria-hidden="true"></canvas>
<main #content id="conteudo" tabindex="-1">
  <router-outlet (activate)="focusPage(content)" />
</main>
