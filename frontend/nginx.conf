map "$request_method:$uri" $auth_rate_key {
    default "";
    "POST:/api/auth/register" "$binary_remote_addr:$uri";
    "POST:/api/auth/confirm" "$binary_remote_addr:$uri";
    "POST:/api/auth/login" "$binary_remote_addr:$uri";
    "GET:/api/auth/csrf" "$binary_remote_addr:$uri";
    "POST:/api/auth/sessions/revoke" "$binary_remote_addr:$uri";
    ~^POST:/api/auth/(mfa/|password/) "$binary_remote_addr:$uri";
}

map "$request_method:$uri" $preview_rate_key {
    default "";
    "POST:/api/hair-plans/preview" $binary_remote_addr;
}

map $uri $access_route {
    default web;
    ~^/api/(?:health|ready)$ $uri;
    ~^/api/auth/login$ /api/auth/login;
    ~^/api/auth/ /api/auth;
    ~^/api/agenda(?:/|$) /api/agenda;
    ~^/api/forum(?:/|$) /api/forum;
    ~^/api/ /api;
}

log_format autocuidado escape=json
    '{"time":"$time_iso8601","route":"$access_route","status":$status,'
    '"seconds":$request_time,"request_id":"$request_id"}';

limit_req_zone $auth_rate_key zone=account_requests:10m rate=12r/m;
limit_req_zone $preview_rate_key zone=preview_requests:10m rate=2r/s;

server {
    listen 80;
    include /etc/nginx/autocuidado/*.conf;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout autocuidado;
    error_log /dev/null;

    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Request-Id $request_id always;

    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;

    limit_req_status 429;
    error_page 429 = @rate_limited;

    location = /api/account/profile/photo {
        limit_req zone=account_requests burst=8 nodelay;
        client_max_body_size 6m;
        proxy_pass http://api:8080;
    }

    location /api/hair-diary/ {
        client_max_body_size 6m;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_pass http://api:8080;
    }

    location /api/ {
        limit_req zone=account_requests burst=8 nodelay;
        limit_req zone=preview_requests burst=12 nodelay;
        proxy_pass http://api:8080;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        return 429 '{"errors":{"body":"Muitas tentativas. Aguarde alguns segundos antes de tentar novamente."}}';
    }

    location ~ ^/(?:design/|media/|[^/]+\.(?:js|css|txt|xml)$) {
        gzip on;
        gzip_types application/javascript text/javascript text/css;
        gzip_vary on;
        try_files $uri =404;
    }

    location = /404/index.html {
        internal;
        sub_filter '__AUTOCUIDADO_CSP_NONCE__' $request_id;
        sub_filter_once off;
        add_header Cache-Control no-store always;
    }

    location / {
        error_page 404 /404/index.html;
        sub_filter '__AUTOCUIDADO_CSP_NONCE__' $request_id;
        sub_filter_once off;
        add_header Cache-Control no-store always;
        try_files $angular_page =404;
    }
}
